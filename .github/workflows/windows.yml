name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and test Windows applications
        shell: powershell
        run: ./BUILD.ps1
      - name: Upload ready-to-run Windows package
        uses: actions/upload-artifact@v4
        with:
          name: OCS-Link-Windows
          path: dist/OCS-Link/
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: OCS-Link-Windows
          path: dist/OCS-Link
      - name: Package ready-to-run application
        shell: pwsh
        run: |
          Compress-Archive -Path dist/OCS-Link -DestinationPath dist/OCS-Link-Windows.zip -Force
      - name: Publish Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "v$version-build.$env:GITHUB_RUN_NUMBER"
          $title = "OCS LINK $version - Windows build $env:GITHUB_RUN_NUMBER"
          $notes = @(
            'Windows x64 package. Extract the ZIP and run START-HOST.bat or START-SENDER.bat.'
            'No .NET SDK or local build is required. Run SETUP-SENDER.bat once on the sending PC for FFmpeg.'
            "Source commit: $env:GITHUB_SHA"
          )
          $notes | Set-Content release-notes.txt -Encoding UTF8
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/OCS-Link-Windows.zip --clobber
          } else {
            gh release create $tag dist/OCS-Link-Windows.zip --target $env:GITHUB_SHA --title $title --notes-file release-notes.txt --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Windows release upload failed' }
