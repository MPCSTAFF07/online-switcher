name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and test Windows applications
        shell: pwsh
        run: ./BUILD.ps1
      - name: Upload ready-to-run Windows package
        uses: actions/upload-artifact@v4
        with:
          name: OCS-Link-Windows
          path: dist/OCS-Link/
          if-no-files-found: error
          retention-days: 14
